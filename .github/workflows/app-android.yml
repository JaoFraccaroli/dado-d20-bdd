name: App Android (APK)

on:
  push:
    branches: [main, app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependências
        run: npm install
      - name: Gerar o site estático
        run: npm run build
      - name: Criar o projeto Android
        run: npx cap add android
      - name: Ícone e tela de abertura
        run: npx capacitor-assets generate --android
      - name: Copiar o site para dentro do app
        run: npx cap sync android
      - name: Usar sempre a mesma assinatura (para atualizar sem desinstalar)
        run: mkdir -p ~/.android && cp android-keystore/debug.keystore ~/.android/debug.keystore
      - name: Gerar o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk rolador-d20.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rolador-d20-apk
          path: rolador-d20.apk
      - name: Publicar o APK na página de Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app-android --cleanup-tag --yes || true
          gh release create app-android rolador-d20.apk \
            --target "${{ github.sha }}" \
            --title "Rolador de D20 para Android" \
            --notes "Baixe o arquivo rolador-d20.apk no celular e abra para instalar. O Android vai pedir para permitir instalar apps desta fonte. Versão gerada automaticamente a partir do commit ${{ github.sha }}."
